services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "8000:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web-dist:/usr/share/caddy:ro
    mem_limit: 64m
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - kasku_internal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - receipts:/data/receipts
    env_file:
      - .env
    command: ["node", "dist/index.js"]
    mem_limit: 192m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - kasku_internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kasku
      POSTGRES_USER: kasku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - kasku_pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasku -d kasku"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - kasku_internal

volumes:
  receipts:
  kasku_pgdata:

networks:
  kasku_internal:
    driver: bridge
